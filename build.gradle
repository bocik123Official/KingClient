plugins {
    id "fabric-loom"
    id "maven-publish" version "1.2.1"
}

version = "1.0.0"
group = "com.kingclient"

base {
    archivesName = "KingClient"
}

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/kingclient.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.5"
    mappings "net.fabricmc:yarn:1.21.5+build.3"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.5"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
